<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="mzSwqTD8qlBhbrKEWwcHlV8Gd5X0bjAq88fw6v3Yed0" />
<title>AIFind - Find Your Perfect AI Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --surface: #0f0f1a;
  --border: rgba(255,255,255,0.07);
  --accent: #7B5EF8;
  --accent2: #F85E9F;
  --text: #f0f0f8;
  --muted: #7070a0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 60% 50% at 20% 20%, rgba(123,94,248,0.12) 0%, transparent 60%),
              radial-gradient(ellipse 50% 40% at 80% 80%, rgba(248,94,159,0.08) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.container {
  max-width: 860px;
  margin: 0 auto;
  padding: 0 24px;
  position: relative;
  z-index: 1;
}
header {
  padding: 40px 0 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.4rem;
}
.logo span {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.badge {
  font-size: 0.72rem;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 100px;
}
.hero {
  padding: 80px 0 50px;
  text-align: center;
}
.hero h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(2.2rem, 6vw, 3.8rem);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -1.5px;
  margin-bottom: 18px;
}
.hero h1 em {
  font-style: normal;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p {
  color: var(--muted);
  font-size: 1.1rem;
  max-width: 480px;
  margin: 0 auto 50px;
  line-height: 1.6;
}
.search-wrap {
  position: relative;
  max-width: 680px;
  margin: 0 auto;
}
.search-box {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px 150px 20px 22px;
  font-size: 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  outline: none;
  resize: none;
  min-height: 66px;
  line-height: 1.5;
  -webkit-appearance: none;
}
.search-box::placeholder { color: var(--muted); }
.search-box:focus {
  border-color: rgba(123,94,248,0.5);
  box-shadow: 0 0 0 3px rgba(123,94,248,0.15);
}
.search-btn {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 12px;
  padding: 11px 20px;
  color: white;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  -webkit-appearance: none;
}
.search-btn:active { opacity: 0.85; }
.examples {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 16px;
}
.chip {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 7px 15px;
  font-size: 0.82rem;
  color: var(--muted);
  cursor: pointer;
  -webkit-appearance: none;
}
.chip:active {
  background: rgba(123,94,248,0.15);
  color: var(--text);
}
.stats {
  display: flex;
  gap: 40px;
  justify-content: center;
  padding: 28px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin: 0 0 50px;
}
.stat-item { text-align: center; }
.stat-num {
  font-family: 'Syne', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-label { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.results-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--muted);
  margin-bottom: 16px;
}
.summary-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px 26px;
  margin-bottom: 18px;
  color: #c8c8e8;
  font-size: 0.96rem;
  line-height: 1.7;
}
.tool-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
  margin-bottom: 80px;
}
.tool-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  text-decoration: none;
  display: block;
}
.tool-card:active { border-color: rgba(123,94,248,0.5); }
.tool-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  margin-bottom: 12px;
}
.tool-name {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.98rem;
  margin-bottom: 6px;
  color: var(--text);
}
.tool-desc {
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 12px;
}
.tool-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 0.7rem;
  padding: 3px 9px;
  border-radius: 100px;
  background: rgba(123,94,248,0.12);
  color: #a78bfa;
  font-weight: 500;
}
.tag-free { background: rgba(94,248,159,0.1); color: #5ef89f; }
.tag-paid { background: rgba(248,94,159,0.1); color: #f85e9f; }
.loading {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  padding: 30px 0;
}
.dots { display: flex; gap: 5px; }
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: bounce 1.2s infinite ease-in-out;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}
@media (max-width: 600px) {
  .hero { padding: 50px 0 36px; }
  .stats { gap: 24px; }
  .search-box { padding: 16px 16px 56px; }
  .search-btn { bottom: 8px; right: 8px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">AI<span>Find</span></div>
    <div class="badge">500+ AI Tools</div>
  </header>

  <section class="hero">
    <h1>Find the <em>perfect AI</em><br>for anything you need</h1>
    <p>Describe what you want to do. We find the best AI tools for you instantly.</p>
    <div class="search-wrap">
      <textarea class="search-box" id="searchInput" placeholder="e.g. I need to edit videos..." rows="1"></textarea>
      <button class="search-btn" id="searchBtn" onclick="findAI()">Find AI</button>
    </div>
    <div class="examples">
      <span class="chip" onclick="doSearch('Excel and spreadsheets')">📊 Excel</span>
      <span class="chip" onclick="doSearch('video editing')">🎬 Video editing</span>
      <span class="chip" onclick="doSearch('writing content')">✍️ Writing</span>
      <span class="chip" onclick="doSearch('image generation')">🎨 Images</span>
      <span class="chip" onclick="doSearch('coding and building apps')">💻 Coding</span>
      <span class="chip" onclick="doSearch('studying and learning')">📚 Studying</span>
    </div>
  </section>

  <div class="stats">
    <div class="stat-item"><div class="stat-num">500+</div><div class="stat-label">AI Tools</div></div>
    <div class="stat-item"><div class="stat-num">50+</div><div class="stat-label">Categories</div></div>
    <div class="stat-item"><div class="stat-num">Free</div><div class="stat-label">Always</div></div>
  </div>

  <div id="resultsArea"></div>
</div>

<script>
var tools = {

    list: [

      { name: "Formula Bot", emoji: "⚡", desc: "Converts plain English into Excel and Google Sheets formulas instantly.", url: "https://formulabot.com", tag: "Formulas", free: true }
    ]
  },
  video: {
    summary: "These AI tools handle video editing and generation automatically — no experience needed.",
    list: [
      { name: "CapCut AI", emoji: "🎬", desc: "The most popular AI video editor. Auto-captions, smart cut, background removal — all free.", url: "https://capcut.com", tag: "Video Editing", free: true },
      { name: "Runway ML", emoji: "🎥", desc: "Generate and edit videos with AI. Remove backgrounds and generate footage from text.", url: "https://runwayml.com", tag: "AI Generation", free: true },
      { name: "Descript", emoji: "✂️", desc: "Edit video by editing text. Cut footage just by deleting words from the transcript.", url: "https://descript.com", tag: "Editing", free: true }
    ]
  },
  writing: {
    summary: "These AI writing tools produce high-quality content in seconds.",
    list: [
      { name: "ChatGPT", emoji: "✍️", desc: "The best all-around writing assistant. Blog posts, emails, social media, scripts — anything.", url: "https://chat.openai.com", tag: "Writing", free: true },
      { name: "Jasper AI", emoji: "🚀", desc: "Professional AI copywriter for marketers. Templates for ads, blogs, and emails.", url: "https://jasper.ai", tag: "Copywriting", free: false },
      { name: "Copy.ai", emoji: "📝", desc: "Generate marketing copy and blog posts in seconds. Great free tier.", url: "https://copy.ai", tag: "Content", free: true }
    ]
  },
  image: {
    summary: "These AI image generators create stunning visuals from text descriptions.",
    list: [
      { name: "Midjourney", emoji: "🎨", desc: "The gold standard for AI art. Creates breathtaking images from text prompts.", url: "https://midjourney.com", tag: "Art Generation", free: false },
      { name: "DALL-E 3", emoji: "🖼️", desc: "OpenAI's image generator built into ChatGPT. Great at following detailed instructions.", url: "https://chat.openai.com", tag: "Image AI", free: true },
      { name: "Adobe Firefly", emoji: "✨", desc: "Adobe's AI image generator. Commercially safe with incredible quality.", url: "https://firefly.adobe.com", tag: "Design", free: true }
    ]
  },
  coding: {
    summary: "These AI coding tools help you build apps and write code faster than ever.",
    list: [
      { name: "GitHub Copilot", emoji: "💻", desc: "The most popular AI coding assistant. Autocompletes code and suggests entire functions.", url: "https://github.com/features/copilot", tag: "Coding", free: false },
      { name: "Claude", emoji: "🤖", desc: "Exceptional at writing and debugging complex code. Explains every decision clearly.", url: "https://claude.ai", tag: "AI Assistant", free: true },
      { name: "Cursor", emoji: "⚡", desc: "A full code editor powered by AI. Chat with your codebase and auto-fix bugs.", url: "https://cursor.sh", tag: "Code Editor", free: true }
    ]
  },

    list: [
      { name: "Notion AI", emoji: "📚", desc: "Summarize lecture notes, generate study guides, and create flashcards automatically.", url: "https://notion.so", tag: "Notes", free: true },
      { name: "ChatGPT", emoji: "🎓", desc: "Your personal tutor 24/7. Explains any concept and quizzes you on any topic.", url: "https://chat.openai.com", tag: "Tutoring", free: true },
      { name: "Anki + AI", emoji: "🧠", desc: "Use AI to generate flashcard decks from your notes and memorize anything fast.", url: "https://apps.ankiweb.net", tag: "Memorization", free: true }
    ]
  },
  marketing: {
    summary: "These AI tools handle your marketing and grow your audience automatically.",
    list: [
      { name: "Buffer AI", emoji: "📱", desc: "AI social media scheduling. Generates post ideas and posts at the best times.", url: "https://buffer.com", tag: "Social Media", free: true },
      { name: "Canva AI", emoji: "🎨", desc: "Design social media posts and ads with AI. Magic Resize and AI image generation included.", url: "https://canva.com", tag: "Design", free: true },
      { name: "Jasper AI", emoji: "🚀", desc: "AI marketing copywriter. Generates ads, emails, landing pages that convert.", url: "https://jasper.ai", tag: "Copywriting", free: false }
    ]

    list: [
      { name: "Suno AI", emoji: "🎵", desc: "Generate complete songs with vocals just by describing what you want.", url: "https://suno.com", tag: "Music Generation", free: true },
      { name: "Udio", emoji: "🎶", desc: "Create high-quality AI music from text. Great for background music and content.", url: "https://udio.com", tag: "Music AI", free: true },
      { name: "Soundraw", emoji: "🎸", desc: "Generate royalty-free music for videos. Customize tempo and mood easily.", url: "https://soundraw.io", tag: "Royalty Free", free: true }
    ]
  },
  presentation: {
    summary: "These AI tools build beautiful presentations from your content automatically.",
    list: [
      { name: "Gamma AI", emoji: "📊", desc: "Best AI presentation maker. Describe your topic and get a full presentation in seconds.", url: "https://gamma.app", tag: "Presentations", free: true },
      { name: "Beautiful.ai", emoji: "✨", desc: "Smart slides that design themselves automatically. Professional without design skills.", url: "https://beautiful.ai", tag: "Slides", free: false },
      { name: "Tome", emoji: "📖", desc: "AI presentations for storytelling and pitch decks.", url: "https://tome.app", tag: "Storytelling", free: true }
    ]
  },
  resume: {
    summary: "These AI tools write and optimize your resume to get you hired faster.",
    list: [
      { name: "Kickresume", emoji: "📄", desc: "AI writes your entire resume from scratch with ATS-optimized templates.", url: "https://kickresume.com", tag: "Resume", free: true },
      { name: "Teal", emoji: "🎯", desc: "Tailors your resume for each job application automatically.", url: "https://tealhq.com", tag: "Job Search", free: true },
      { name: "ChatGPT", emoji: "✍️", desc: "Paste your resume and job description — AI rewrites it to match perfectly.", url: "https://chat.openai.com", tag: "Writing", free: true }
    ]
  },
  translation: {
    summary: "These AI tools translate text and help you communicate in any language.",
    list: [
      { name: "DeepL", emoji: "🌍", desc: "The most accurate AI translator. Far better than Google Translate for natural results.", url: "https://deepl.com", tag: "Translation", free: true },
      { name: "ChatGPT", emoji: "🗣️", desc: "Translates while preserving tone and context. Also helps with language learning.", url: "https://chat.openai.com", tag: "Language", free: true },
      { name: "Whisper AI", emoji: "🎤", desc: "Transcribes and translates spoken audio in dozens of languages accurately.", url: "https://openai.com/research/whisper", tag: "Speech", free: true }
    ]
  },
  chatbot: {
    summary: "These AI tools let you build chatbots and automate conversations without coding.",
    list: [
      { name: "Chatbase", emoji: "💬", desc: "Upload documents and create an AI chatbot for your website instantly.", url: "https://chatbase.co", tag: "Chatbots", free: true },
      { name: "ManyChat", emoji: "🤖", desc: "Automate Instagram, WhatsApp, and Facebook conversations with AI.", url: "https://manychat.com", tag: "Automation", free: true },
      { name: "Tidio", emoji: "📬", desc: "AI live chat for websites. Answers questions and captures leads 24/7.", url: "https://tidio.com", tag: "Support", free: true }
    ]
  }
};

function getMatch(q) {
  q = q.toLowerCase();
  if (/excel|spreadsheet|formula|sheets|csv/.test(q)) return tools.excel;
  if (/video|edit|film|reel|tiktok|youtube|clip/.test(q)) return tools.video;
  if (/writ|blog|content|copy|article|essay|email|caption/.test(q)) return tools.writing;
  if (/image|photo|art|picture|illustration|graphic|logo/.test(q)) return tools.image;
  if (/code|program|app|software|develop|html|python|javascript|build/.test(q)) return tools.coding;
  if (/study|learn|school|exam|note|tutor|course|homework/.test(q)) return tools.studying;
  if (/market|social|instagram|advertis|brand|campaign|grow/.test(q)) return tools.marketing;
  if (/music|song|audio|sound|beat|melody|track|podcast/.test(q)) return tools.music;
  if (/present|slide|pitch|deck|powerpoint/.test(q)) return tools.presentation;
  if (/resum|cv|job|hire|interview|career/.test(q)) return tools.resume;
  if (/translat|language|arabic|french|spanish|german/.test(q)) return tools.translation;
  if (/chatbot|customer|support|automat|bot/.test(q)) return tools.chatbot;
  return {
    summary: "Here are the most powerful and versatile AI tools that can help with almost anything.",
    list: [
      { name: "ChatGPT", emoji: "🤖", desc: "The world's most versatile AI. Writing, coding, research, math, brainstorming — handles anything.", url: "https://chat.openai.com", tag: "General AI", free: true },
      { name: "Claude", emoji: "⚡", desc: "Exceptional for complex reasoning, long documents, coding, and nuanced writing.", url: "https://claude.ai", tag: "General AI", free: true },
      { name: "Perplexity AI", emoji: "🔍", desc: "AI search engine that gives direct answers with cited sources. Perfect for research.", url: "https://perplexity.ai", tag: "Research", free: true }
    ]
  };
}

function doSearch(text) {
  document.getElementById('searchInput').value = text;
  findAI();
}

function findAI() {
  var input = document.getElementById('searchInput');
  var btn = document.getElementById('searchBtn');
  var area = document.getElementById('resultsArea');
  var query = input.value;
  if (!query || query.trim() === '') return;
  query = query.trim();
  btn.disabled = true;
  btn.textContent = 'Searching...';
  area.innerHTML = '<div class="loading"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span>Finding the best AI tools for you...</span></div>';
  setTimeout(function() {
    var data = getMatch(query);
    var html = '';
    html += '<div class="results-label">Results for &quot;' + query + '&quot;</div>';
    html += '<div class="summary-box">' + data.summary + '</div>';
    html += '<div class="tool-cards">';
    for (var i = 0; i < data.list.length; i++) {
      var t = data.list[i];
      html += '<a href="' + t.url + '" target="_blank" class="tool-card">';
      html += '<div class="tool-icon">' + t.emoji + '</div>';
      html += '<div class="tool-name">' + t.name + '</div>';
      html += '<div class="tool-desc">' + t.desc + '</div>';
      html += '<div class="tool-tags">';
      html += '<span class="tag">' + t.tag + '</span>';
      if (t.free) {
        html += '<span class="tag tag-free">Free tier</span>';
      } else {
        html += '<span class="tag tag-paid">Paid</span>';
      }
      html += '</div></a>';
    }
    html += '</div>';
    area.innerHTML = html;
    btn.disabled = false;
    btn.textContent = 'Find AI';
  }, 800);
}

var input = document.getElementById('searchInput');
input.addEventListener('keydown', function(e) {
  if (e.keyCode === 13) {
    e.preventDefault();
    findAI();
  }
});
</script>

</body>
</html>
